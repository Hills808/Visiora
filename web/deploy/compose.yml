name: visiora-luna
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      PORT: "8080"
      VISIORA_PUBLIC_ORIGIN: "https://${VISIORA_HOST:?Defina VISIORA_HOST no deploy/.env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - luna_ledger:/app/.runtime
    read_only: true
    init: true
    restart: unless-stopped
  https:
    image: caddy:2.11.7-alpine
    network_mode: "service:gateway"
    depends_on:
      - gateway
    environment:
      VISIORA_HOST: "${VISIORA_HOST:?Defina VISIORA_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./auth.caddy:/etc/caddy/auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
volumes:
  luna_ledger:
  caddy_data:
  caddy_config:
